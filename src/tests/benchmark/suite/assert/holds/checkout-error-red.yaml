# tags: visual, text
name: "Red error box"
description: "Assert case: the last step holds"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-backpack"]'
  - click:
      selector: '[data-test="shopping-cart-link"]'
  - assert:
      selector: '[data-test="title"]'
      text: "Your Cart"
  - click:
      selector: '[data-test="checkout"]'
  - assert:
      selector: '[data-test="title"]'
      text: "Checkout: Your Information"
  - click:
      selector: '[data-test="continue"]'
  - assert:
      statement: "A red error box says that the first name is required"
