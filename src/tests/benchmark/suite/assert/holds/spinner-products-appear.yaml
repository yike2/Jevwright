name: "Products after the spinner"
description: "Assert case: the last step holds"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - open:
      url: "/dynamic-catalog-spinner.html"
  - waitFor:
      condition: "Product cards with names and prices are shown instead of a loading spinner"
