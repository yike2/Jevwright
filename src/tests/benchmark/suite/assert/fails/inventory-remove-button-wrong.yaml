# tags: state
name: "Remove button said too early"
description: "Assert case: the last step fails"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - assert:
      statement: "The Sauce Labs Backpack card shows a 'Remove' button"
