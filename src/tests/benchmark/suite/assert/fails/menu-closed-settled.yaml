# tags: negation, state
name: "Menu said to be closed once it has settled"
description: "Assert case: the last step fails"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: "#react-burger-menu-btn"
  - waitFor:
      selector: '[data-test="logout-sidebar-link"]'
  - sleep:
      ms: 1000
  - assert:
      statement: "No side menu is open"
