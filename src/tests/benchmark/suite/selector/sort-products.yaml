name: "Sort products"
description: "Sorting by name from Z to A puts the red T-shirt first"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="product-sort-container"]'
  - press:
      key: "ArrowDown"
  - press:
      key: "Enter"
  - assert:
      selector: '[data-test="active-option"]'
      text: "Name (Z to A)"
  - assert:
      selector: '[data-test="inventory-item-name"]'
      text: "Test.allTheThings() T-Shirt (Red)"
