name: "Checkout form errors"
description: "Each missing field of the checkout form shows its error"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-backpack"]'
  - click:
      selector: '[data-test="shopping-cart-link"]'
  - click:
      selector: '[data-test="checkout"]'
  - click:
      selector: '[data-test="continue"]'
  - assert:
      selector: '[data-test="error"]'
      text: "First Name is required"
  - input:
      selector: '[data-test="firstName"]'
      value: "Ada"
  - click:
      selector: '[data-test="continue"]'
  - assert:
      selector: '[data-test="error"]'
      text: "Last Name is required"
  - input:
      selector: '[data-test="lastName"]'
      value: "Lovelace"
  - click:
      selector: '[data-test="continue"]'
  - assert:
      selector: '[data-test="error"]'
      text: "Postal Code is required"
