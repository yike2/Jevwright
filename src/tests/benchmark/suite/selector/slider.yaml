name: "Catalog slider"
description: "A slider dot shows its product"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - open:
      url: "/dynamic-catalog-slider.html"
  - click:
      selector: '[data-test="dynamic-catalog-slider-dot-4"]'
  - assert:
      selector: '[data-test="dynamic-catalog-slider-item-name"]'
      text: "Sauce Labs Backpack"
