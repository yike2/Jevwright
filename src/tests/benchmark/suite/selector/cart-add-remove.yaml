name: "Add and remove cart items"
description: "Adding two products and removing one updates the cart badge"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-backpack"]'
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-bike-light"]'
  - assert:
      selector: '[data-test="shopping-cart-badge"]'
      text: "2"
  - click:
      selector: '[data-test="remove-sauce-labs-backpack"]'
  - assert:
      selector: '[data-test="shopping-cart-badge"]'
      text: "1"
  - assert:
      selector: '[data-test="remove-sauce-labs-bike-light"]'
