name: "Log out from the menu"
description: "The side menu signs the user out"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: "#react-burger-menu-btn"
  - waitFor:
      selector: '[data-test="logout-sidebar-link"]'
  - click:
      selector: '[data-test="logout-sidebar-link"]'
  - assert:
      selector: '[data-test="login-button"]'
