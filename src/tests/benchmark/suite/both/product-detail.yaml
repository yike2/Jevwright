name: "Product detail"
description: "A product's detail page adds it to the cart and goes back to the list"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      target: "Username text field in the login form"
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      target: "Password text field in the login form"
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
      target: "Green 'Login' button below the password field"
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="item-0-title-link"]'
      target: "Product name link 'Sauce Labs Bike Light' in the product list"
  - assert:
      selector: '[data-test="inventory-item-name"]'
      text: "Sauce Labs Bike Light"
  - click:
      selector: "#add-to-cart-button" # stale
      target: "'Add to cart' button on the product detail page"
  - assert:
      selector: '[data-test="shopping-cart-badge"]'
      text: "1"
  - click:
      selector: "#back-to-products-btn" # stale
      target: "'Back to products' button at the top left"
  - waitFor:
      url: "**/inventory.html"
  - assert:
      selector: '[data-test="remove-sauce-labs-bike-light"]'
