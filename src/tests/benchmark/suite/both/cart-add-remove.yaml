name: "Add and remove cart items"
description: "Adding two products and removing one updates the cart badge"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      target: "Username text field in the login form"
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      target: "Password text field in the login form"
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
      target: "Green 'Login' button below the password field"
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="add-to-cart-backpack"]' # stale
      target: "'Add to cart' button of the Sauce Labs Backpack product card"
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-bike-light"]'
      target: "'Add to cart' button of the Sauce Labs Bike Light product card"
  - assert:
      selector: '[data-test="shopping-cart-badge"]'
      text: "2"
  - click:
      selector: "#remove-backpack" # stale
      target: "'Remove' button of the Sauce Labs Backpack product card"
  - assert:
      selector: '[data-test="shopping-cart-badge"]'
      text: "1"
  - assert:
      selector: '[data-test="remove-sauce-labs-bike-light"]'
