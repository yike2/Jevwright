name: "Catalog slider"
description: "A slider dot shows its product"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      target: "Username text field in the login form"
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      target: "Password text field in the login form"
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
      target: "Green 'Login' button below the password field"
  - waitFor:
      url: "**/inventory.html"
  - open:
      url: "/dynamic-catalog-slider.html"
  - click:
      selector: "#slider-dot-4" # stale
      target: "Fifth of the six dots below the product slider"
  - assert:
      selector: '[data-test="dynamic-catalog-slider-item-name"]'
      text: "Sauce Labs Backpack"
