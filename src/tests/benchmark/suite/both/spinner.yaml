name: "Catalog behind a spinner"
description: "The products appear after the spinner"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      target: "Username text field in the login form"
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      target: "Password text field in the login form"
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: "#login-btn" # stale
      target: "Green 'Login' button below the password field"
  - waitFor:
      url: "**/inventory.html"
  - open:
      url: "/dynamic-catalog-spinner.html"
  - waitFor:
      selector: '[data-test="spinner-item-5-name"]'
  - assert:
      selector: '[data-test="spinner-item-5-name"]'
      text: "Sauce Labs Fleece Jacket"
