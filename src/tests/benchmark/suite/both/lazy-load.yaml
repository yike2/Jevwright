name: "Lazy-loaded catalog"
description: "Scrolling down loads more products"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      target: "Username text field in the login form"
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      target: "Password text field in the login form"
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: "#login-btn" # stale
      target: "Green 'Login' button below the password field"
  - waitFor:
      url: "**/inventory.html"
  - open:
      url: "/dynamic-catalog-lazy-load.html"
  - assert:
      selector: '[data-test="lazy-load-item-0-name"]'
      text: "Sauce Labs Bike Light"
  - scroll:
      direction: "down"
      distance: 3000
  - waitFor:
      selector: '[data-test="lazy-load-item-15-name"]'
  - assert:
      selector: '[data-test="lazy-load-item-15-name"]'
      text: "Test.allTheThings() T-Shirt (Red) (XL)"
