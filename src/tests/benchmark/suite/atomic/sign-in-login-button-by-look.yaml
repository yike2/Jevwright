# tags: button, by-look
name: "Login button by its look"
description: "Atomic case: login button by its look, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      target: "Wide green button at the bottom of the login form"
  - waitFor:
      url: "**/inventory.html"
