name: "Spinner submenu item"
description: "Atomic case: spinner submenu item, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: "#react-burger-menu-btn"
  - waitFor:
      selector: '[data-test="logout-sidebar-link"]'
  - click:
      selector: '[data-test="dynamic-catalog-sidebar-link"]'
  - click:
      target: "'Spinner' item under 'Dynamic Catalog' in the side menu"
  - waitFor:
      url: "**/dynamic-catalog-spinner.html"
