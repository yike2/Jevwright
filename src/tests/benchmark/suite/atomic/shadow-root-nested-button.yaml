# tags: button, shadow, by-text
name: "Button in a nested shadow root"
description: "Atomic case: button in a nested shadow root, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/shadow-dom/nested-shadow-root.html"
  - click:
      target: "'Inner Button'"
  - assert:
      selector: "#inner-button:focus"
