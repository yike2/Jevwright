# tags: icon, small, dynamic, by-look
name: "First slider dot"
description: "Atomic case: first slider dot, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - open:
      url: "/dynamic-catalog-slider.html"
  - click:
      target: "First, leftmost dot below the product slider"
  - assert:
      selector: '[data-test="dynamic-catalog-slider-item-name"]'
      text: "Sauce Labs Bike Light"
