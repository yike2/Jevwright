# tags: icon, small, dynamic, by-relation
name: "Slider dot by its product"
description: "Atomic case: slider dot by its product, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - open:
      url: "/dynamic-catalog-slider.html"
  - click:
      target: "Dot below the slider that shows the Sauce Labs Backpack"
  - assert:
      selector: '[data-test="dynamic-catalog-slider-item-name"]'
      text: "Sauce Labs Backpack"
