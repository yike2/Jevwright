# tags: button, repeated, by-look
name: "Add the Backpack by its place"
description: "Atomic case: add the Backpack by its place, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "'Add to cart' button in the top-left product card"
  - assert:
      selector: '[data-test="remove-sauce-labs-backpack"]'
