# tags: button, repeated, offscreen, by-relation
name: "Remove the last of five cart items"
description: "Atomic case: remove the last of five cart items, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-backpack"]'
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-bike-light"]'
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-bolt-t-shirt"]'
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-fleece-jacket"]'
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-onesie"]'
  - click:
      selector: '[data-test="shopping-cart-link"]'
  - assert:
      selector: '[data-test="title"]'
      text: "Your Cart"
  - click:
      target: "'Remove' button of the Sauce Labs Onesie in the cart"
  - assert:
      selector: '[data-test="shopping-cart-badge"]'
      text: "4"
  - assert:
      selector: '[data-test="remove-sauce-labs-backpack"]'
  - assert:
      selector: '[data-test="remove-sauce-labs-fleece-jacket"]'
