# tags: button, by-text
name: "Back to products"
description: "Atomic case: back to products, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="item-4-title-link"]'
  - click:
      target: "'Back to products' button"
  - assert:
      selector: '[data-test="title"]'
      text: "Products"
