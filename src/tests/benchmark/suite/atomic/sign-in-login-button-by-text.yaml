# tags: button, by-text
name: "Login button by its text"
description: "Atomic case: login button by its text, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      target: "'Login' button"
  - waitFor:
      url: "**/inventory.html"
