# tags: menu-item, overlay, by-text
name: "Profile in the hover menu"
description: "Atomic case: profile in the hover menu, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/extras/menus.html"
  - hover:
      selector: "#account-menu"
  - click:
      target: "'Profile' item in the Account menu"
  - assert:
      selector: "#status"
      text: "Showing your profile."
