# tags: image, repeated, changed-layout, by-relation
name: "Backpack with a wrong photo"
description: "Atomic case: backpack with a wrong photo, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "visual_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Product photo of the Sauce Labs Backpack"
  - assert:
      selector: '[data-test="inventory-item-name"]'
      text: "Sauce Labs Backpack"
