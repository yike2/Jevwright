# tags: button, by-look
name: "Checkout button by its look"
description: "Atomic case: checkout button by its look, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-backpack"]'
  - click:
      selector: '[data-test="shopping-cart-link"]'
  - assert:
      selector: '[data-test="title"]'
      text: "Your Cart"
  - click:
      target: "Green button at the bottom right of the cart"
  - assert:
      selector: '[data-test="title"]'
      text: "Checkout: Your Information"
