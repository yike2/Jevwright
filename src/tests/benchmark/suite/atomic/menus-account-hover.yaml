# tags: button, by-text
name: "Account menu on hover"
description: "Atomic case: account menu on hover, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/extras/menus.html"
  - hover:
      target: "'Account' menu button"
  - click:
      selector: "#profile-link"
  - assert:
      selector: "#status"
      text: "Showing your profile."
