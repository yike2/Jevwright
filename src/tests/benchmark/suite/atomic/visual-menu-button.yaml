# tags: icon, small, changed-layout, by-look
name: "Rotated menu button"
description: "Atomic case: rotated menu button, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "visual_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Hamburger menu button at the top left of the header"
  - assert:
      selector: '[data-test="logout-sidebar-link"]'
