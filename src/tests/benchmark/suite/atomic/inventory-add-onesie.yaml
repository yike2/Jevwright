# tags: button, repeated, offscreen, by-relation
name: "Add the Onesie below the fold"
description: "Atomic case: add the Onesie below the fold, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "'Add to cart' button of the Sauce Labs Onesie product card"
  - assert:
      selector: '[data-test="remove-sauce-labs-onesie"]'
