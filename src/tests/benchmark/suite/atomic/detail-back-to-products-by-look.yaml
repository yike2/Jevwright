# tags: button, by-look
name: "Back to products by its place"
description: "Atomic case: back to products by its place, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="item-4-title-link"]'
  - click:
      target: "Button with a left arrow at the top left, above the product photo"
  - assert:
      selector: '[data-test="title"]'
      text: "Products"
