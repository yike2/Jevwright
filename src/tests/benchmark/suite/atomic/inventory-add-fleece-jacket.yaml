name: "Add the Fleece Jacket among six products"
description: "Atomic case: add the fleece jacket among six products, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "'Add to cart' button of the Sauce Labs Fleece Jacket product card"
  - assert:
      selector: '[data-test="remove-sauce-labs-fleece-jacket"]'
