# tags: menu-item, overlay, animating, vague
name: "Logout, vague"
description: "Atomic case: logout, vague, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: "#react-burger-menu-btn"
  - waitFor:
      selector: '[data-test="logout-sidebar-link"]'
  - click:
      target: "log out"
  - assert:
      selector: '[data-test="login-button"]'
