name: "Error close button"
description: "Atomic case: error close button, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "locked_out_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - assert:
      selector: '[data-test="error"]'
      text: "locked out"
  - click:
      target: "Small 'X' close button at the right end of the red error message"
  - assert:
      selector: '[data-test="username"]:not(.error)'
