name: "Delete account with a confirm"
description: "Atomic case: delete account with a confirm, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/extras/dialogs.html"
  - click:
      target: "Red 'Delete account' button in the Danger zone"
      dialog: { accept: false }
  - assert:
      selector: "#status"
      text: "Your account was kept."
