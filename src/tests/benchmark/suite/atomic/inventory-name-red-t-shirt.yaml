# tags: link, repeated, offscreen, by-text
name: "Product name below the fold"
description: "Atomic case: product name below the fold, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Product name link 'Test.allTheThings() T-Shirt (Red)'"
  - assert:
      selector: '[data-test="inventory-item-name"]'
      text: "Test.allTheThings() T-Shirt (Red)"
