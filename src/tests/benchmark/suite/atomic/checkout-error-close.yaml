name: "Error close button on the checkout form"
description: "Atomic case: error close button on the checkout form, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="add-to-cart-sauce-labs-backpack"]'
  - click:
      selector: '[data-test="shopping-cart-link"]'
  - assert:
      selector: '[data-test="title"]'
      text: "Your Cart"
  - click:
      selector: '[data-test="checkout"]'
  - assert:
      selector: '[data-test="title"]'
      text: "Checkout: Your Information"
  - click:
      selector: '[data-test="continue"]'
  - assert:
      selector: '[data-test="error"]'
      text: "First Name is required"
  - click:
      target: "Small 'X' close button at the right end of the red error message"
  - assert:
      selector: '[data-test="firstName"]:not(.error)'
