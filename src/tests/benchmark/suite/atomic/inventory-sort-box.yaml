name: "Sort box"
description: "Atomic case: sort box, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Sort dropdown showing 'Name (A to Z)' at the top right of the product list"
  - press:
      key: "ArrowDown"
  - press:
      key: "Enter"
  - assert:
      selector: '[data-test="active-option"]'
      text: "Name (Z to A)"
