# tags: menu-item, overlay, animating, by-text
name: "Logout while the menu slides in"
description: "Atomic case: logout while the menu slides in, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: "#react-burger-menu-btn"
  - waitFor:
      selector: '[data-test="logout-sidebar-link"]'
  - click:
      target: "'Logout' link in the side menu"
  - assert:
      selector: '[data-test="login-button"]'
