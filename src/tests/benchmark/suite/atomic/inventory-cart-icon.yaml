# tags: icon, by-look
name: "Cart icon"
description: "Atomic case: cart icon, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Shopping cart icon in the top-right corner of the header"
  - assert:
      selector: '[data-test="title"]'
      text: "Your Cart"
