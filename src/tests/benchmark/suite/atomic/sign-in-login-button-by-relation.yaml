# tags: button, by-relation
name: "Login button by the password field"
description: "Atomic case: login button by the password field, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      target: "Button right below the password field"
  - waitFor:
      url: "**/inventory.html"
