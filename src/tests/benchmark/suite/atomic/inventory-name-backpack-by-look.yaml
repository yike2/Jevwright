# tags: link, repeated, by-look
name: "Product name by its place"
description: "Atomic case: product name by its place, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Bold product title in the first product card"
  - assert:
      selector: '[data-test="inventory-item-name"]'
      text: "Sauce Labs Backpack"
