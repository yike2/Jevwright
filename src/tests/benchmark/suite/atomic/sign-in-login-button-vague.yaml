# tags: button, vague
name: "Login button, vague"
description: "Atomic case: login button, vague, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      target: "login"
  - waitFor:
      url: "**/inventory.html"
