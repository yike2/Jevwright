# tags: button, repeated, by-relation
name: "Add the Bolt T-Shirt among six products"
description: "Atomic case: add the Bolt T-Shirt among six products, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "'Add to cart' button of the Sauce Labs Bolt T-Shirt product card"
  - assert:
      selector: '[data-test="remove-sauce-labs-bolt-t-shirt"]'
