# tags: menu-item, overlay, by-text
name: "Delete in the right-click menu"
description: "Atomic case: delete in the right-click menu, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/extras/menus.html"
  - rightClick:
      selector: '[data-file="packing-list.txt"]'
  - click:
      target: "'Delete' item in the right-click menu"
  - assert:
      selector: "#status"
      text: "Deleted packing-list.txt."
