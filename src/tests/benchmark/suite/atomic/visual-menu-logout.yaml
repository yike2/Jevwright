# tags: menu-item, overlay, animating, changed-layout, by-text
name: "Logout on a changed page"
description: "Atomic case: logout on a changed page, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "visual_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: "#react-burger-menu-btn"
  - waitFor:
      selector: '[data-test="logout-sidebar-link"]'
  - click:
      target: "'Logout' link in the side menu"
  - assert:
      selector: '[data-test="login-button"]'
