name: "Product name link"
description: "Atomic case: product name link, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Product name link 'Sauce Labs Fleece Jacket'"
  - assert:
      selector: '[data-test="inventory-item-name"]'
      text: "Sauce Labs Fleece Jacket"
