name: "Slider dot"
description: "Atomic case: slider dot, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - open:
      url: "/dynamic-catalog-slider.html"
  - click:
      target: "Fifth of the six dots below the product slider"
  - assert:
      selector: '[data-test="dynamic-catalog-slider-item-name"]'
      text: "Sauce Labs Backpack"
