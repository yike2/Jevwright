# tags: button, repeated, offscreen, by-relation
name: "Add the red T-shirt below the fold"
description: "Atomic case: add the red T-shirt below the fold, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "'Add to cart' button of the Test.allTheThings() T-Shirt (Red) product card"
  - assert:
      selector: '[data-test="remove-test.allthethings()-t-shirt-(red)"]'
