# tags: button, by-text
name: "Add to cart on the detail page"
description: "Atomic case: add to cart on the detail page, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="item-4-title-link"]'
  - click:
      target: "'Add to cart' button on the product detail page"
  - assert:
      selector: '[data-test="shopping-cart-badge"]'
      text: "1"
