# tags: image, repeated, by-look
name: "Product image by its place"
description: "Atomic case: product image by its place, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Photo in the first product card at the top left"
  - assert:
      selector: '[data-test="inventory-item-name"]'
      text: "Sauce Labs Backpack"
