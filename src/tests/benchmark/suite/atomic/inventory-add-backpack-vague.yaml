# tags: button, repeated, vague
name: "Add the Backpack, vague"
description: "Atomic case: add the Backpack, vague, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "add backpack to cart"
  - assert:
      selector: '[data-test="remove-sauce-labs-backpack"]'
