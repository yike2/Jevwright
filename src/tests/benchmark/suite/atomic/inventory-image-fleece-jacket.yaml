# tags: image, repeated, by-relation
name: "Fleece Jacket image"
description: "Atomic case: fleece Jacket image, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Product photo of the Sauce Labs Fleece Jacket"
  - assert:
      selector: '[data-test="inventory-item-name"]'
      text: "Sauce Labs Fleece Jacket"
