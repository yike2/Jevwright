# tags: icon, vague
name: "Cart icon, vague"
description: "Atomic case: cart icon, vague, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "cart"
  - assert:
      selector: '[data-test="title"]'
      text: "Your Cart"
