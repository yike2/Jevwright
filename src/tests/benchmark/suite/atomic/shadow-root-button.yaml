# tags: button, shadow, by-text
name: "Button in a shadow root"
description: "Atomic case: button in a shadow root, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/shadow-dom/shadow-root.html"
  - click:
      target: "'Shadow Button'"
  - assert:
      selector: "#shadow-button:focus"
