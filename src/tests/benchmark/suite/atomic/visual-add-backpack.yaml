# tags: button, repeated, changed-layout, by-relation
name: "Add the Backpack with a wrong photo"
description: "Atomic case: add the Backpack with a wrong photo, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "visual_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "'Add to cart' button of the Sauce Labs Backpack product card"
  - assert:
      selector: '[data-test="remove-sauce-labs-backpack"]'
