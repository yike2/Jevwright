# tags: menu-item, overlay, by-text
name: "All Items once the menu has settled"
description: "Atomic case: all Items once the menu has settled, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      selector: '[data-test="shopping-cart-link"]'
  - assert:
      selector: '[data-test="title"]'
      text: "Your Cart"
  - click:
      selector: "#react-burger-menu-btn"
  - waitFor:
      selector: '[data-test="logout-sidebar-link"]'
  - sleep:
      ms: 1000
  - click:
      target: "'All Items' link in the side menu"
  - assert:
      selector: '[data-test="title"]'
      text: "Products"
