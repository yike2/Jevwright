# tags: icon, small, vague
name: "Menu button, vague"
description: "Atomic case: menu button, vague, found by target"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      selector: '[data-test="username"]'
      value: "standard_user"
  - input:
      selector: '[data-test="password"]'
      value: "{{SWAG_PASSWORD}}"
  - click:
      selector: '[data-test="login-button"]'
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "menu"
  - assert:
      selector: '[data-test="logout-sidebar-link"]'
