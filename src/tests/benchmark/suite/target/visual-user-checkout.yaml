name: "Visual user checkout"
description: "visual_user buys the backpack on a page with moved elements"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      target: "Username text field in the login form"
      value: "visual_user"
  - input:
      target: "Password text field in the login form"
      value: "{{SWAG_PASSWORD}}"
  - click:
      target: "Green 'Login' button below the password field"
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "'Add to cart' button of the Sauce Labs Backpack product card"
  - click:
      target: "Shopping cart icon in the top-right corner of the header"
  - assert:
      selector: '[data-test="title"]'
      text: "Your Cart"
  - click:
      target: "Green 'Checkout' button on the cart page"
  - input:
      target: "'First Name' text field of the checkout form"
      value: "Ada"
  - input:
      target: "'Last Name' text field of the checkout form"
      value: "Lovelace"
  - input:
      target: "'Zip/Postal Code' text field of the checkout form"
      value: "10001"
  - click:
      target: "'Continue' button below the checkout form"
  - assert:
      selector: '[data-test="total-label"]'
      text: "Total: $32.39"
  - click:
      target: "Green 'Finish' button below the order summary"
  - assert:
      selector: '[data-test="complete-header"]'
      text: "Thank you for your order!"
