name: "Problem user cart"
description: "problem_user adds two products, removes one in the cart, and signs out"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      target: "Username text field in the login form"
      value: "problem_user"
  - input:
      target: "Password text field in the login form"
      value: "{{SWAG_PASSWORD}}"
  - click:
      target: "Green 'Login' button below the password field"
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "'Add to cart' button of the Sauce Labs Backpack product card"
  - click:
      target: "'Add to cart' button of the Sauce Labs Bike Light product card"
  - assert:
      selector: '[data-test="shopping-cart-badge"]'
      text: "2"
  - click:
      target: "Shopping cart icon in the top-right corner of the header"
  - assert:
      selector: '[data-test="title"]'
      text: "Your Cart"
  - click:
      target: "'Remove' button of the Sauce Labs Bike Light in the cart"
  - assert:
      selector: '[data-test="shopping-cart-badge"]'
      text: "1"
  - click:
      target: "Hamburger menu button at the top left of the header"
  - waitFor:
      selector: '[data-test="logout-sidebar-link"]'
  - click:
      target: "'Logout' link in the side menu"
  - assert:
      selector: '[data-test="login-button"]'
