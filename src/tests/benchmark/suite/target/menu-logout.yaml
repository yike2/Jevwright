name: "Log out from the menu"
description: "The side menu signs the user out"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      target: "Username text field in the login form"
      value: "standard_user"
  - input:
      target: "Password text field in the login form"
      value: "{{SWAG_PASSWORD}}"
  - click:
      target: "Green 'Login' button below the password field"
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Hamburger menu button at the top left of the header"
  - waitFor:
      selector: '[data-test="logout-sidebar-link"]'
  - click:
      target: "'Logout' link in the side menu"
  - assert:
      selector: '[data-test="login-button"]'
