name: "Sort products"
description: "Sorting by name from Z to A puts the red T-shirt first"
baseUrl: "{{BASE}}"
steps:
  - open:
      url: "/"
  - input:
      target: "Username text field in the login form"
      value: "standard_user"
  - input:
      target: "Password text field in the login form"
      value: "{{SWAG_PASSWORD}}"
  - click:
      target: "Green 'Login' button below the password field"
  - waitFor:
      url: "**/inventory.html"
  - click:
      target: "Sort dropdown showing 'Name (A to Z)' at the top right of the product list"
  - press:
      key: "ArrowDown"
  - press:
      key: "Enter"
  - assert:
      selector: '[data-test="active-option"]'
      text: "Name (Z to A)"
  - assert:
      selector: '[data-test="inventory-item-name"]'
      text: "Test.allTheThings() T-Shirt (Red)"
