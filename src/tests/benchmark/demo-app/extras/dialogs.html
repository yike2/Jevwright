<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account settings</title>
    <link rel="stylesheet" href="/extras/extras.css" />
  </head>
  <body>
    <main>
      <h1>Account settings</h1>
      <section aria-labelledby="profile">
        <h2 id="profile">Profile</h2>
        <p>Display name: <strong id="display-name">Sauce Fan</strong></p>
        <button type="button" id="rename">Change display name</button>
        <button type="button" id="save">Save profile</button>
      </section>
      <section aria-labelledby="danger">
        <h2 id="danger">Danger zone</h2>
        <button type="button" id="delete" class="danger">Delete account</button>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const status = document.getElementById("status");
      document.getElementById("save").addEventListener("click", () => {
        alert("Profile saved");
        status.textContent = "Your profile was saved.";
      });
      document.getElementById("rename").addEventListener("click", () => {
        const name = prompt("New display name", "Sauce Fan");
        if (name === null) return void (status.textContent = "The display name was not changed.");
        document.getElementById("display-name").textContent = name;
        status.textContent = `Your display name is now ${name}.`;
      });
      document.getElementById("delete").addEventListener("click", () => {
        status.textContent = confirm("Delete your account? This cannot be undone.")
          ? "Your account was deleted."
          : "Your account was kept.";
      });
    </script>
  </body>
</html>
