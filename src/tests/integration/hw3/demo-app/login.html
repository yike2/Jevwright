<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jevwright Demo — Sign In</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 720px;
      width: 1280px;
    }
    .card {
      background: #ffffff;
      width: 420px;
      padding: 36px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .banner {
      margin: 0 0 24px;
      padding: 10px 12px;
      background: #eff6ff;
      color: #1e40af;
      border-radius: 6px;
      font-size: 13px;
    }
    .field { margin-bottom: 18px; }
    label.field-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      height: 40px;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    button.secondary {
      height: 40px;
      padding: 0 14px;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-size: 14px;
    }
    .checkbox-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    button.primary {
      width: 100%;
      height: 42px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button.disabled-btn {
      width: 100%;
      height: 38px;
      background: #e5e7eb;
      color: #9ca3af;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign in to Jevwright</h1>
    <div id="login-banner" class="banner">Use your corporate credentials to sign in</div>
    <form onsubmit="return false;">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <div class="input-row">
          <input id="password" type="password" placeholder="Enter your password" />
          <button id="toggle-password" type="button" class="secondary">Show password</button>
        </div>
      </div>
      <div class="options-row">
        <span class="checkbox-wrap">
          <input id="remember-me" type="checkbox" aria-label="Remember me" />
          <span>Remember me</span>
        </span>
        <a id="forgot-password" href="#forgot">Forgot password?</a>
      </div>
      <button id="sign-in-btn" type="submit" class="primary">Sign in</button>
      <button id="sso-btn" type="button" class="disabled-btn" disabled>SSO Login (Coming Soon)</button>
    </form>
  </main>
</body>
</html>
