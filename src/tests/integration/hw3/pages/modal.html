<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jevwright Demo — Modal Dialog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f8fafc; color: #0f172a; width: 1024px; height: 768px; position: relative; overflow: hidden; }
    .bg-page { padding: 40px 48px; }
    .bg-page h1 { font-size: 24px; margin-bottom: 16px; }
    .bg-form { max-width: 420px; background: #ffffff; padding: 24px; border-radius: 8px; border: 1px solid #cbd5e1; }
    .bg-form label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .bg-form input { width: 100%; height: 40px; padding: 8px 12px; border: 1px solid #94a3b8; border-radius: 6px; margin-bottom: 16px; }
    .bg-save-btn { height: 40px; padding: 0 20px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-dialog { width: 460px; background: #ffffff; border-radius: 12px; padding: 28px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25); z-index: 200; position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-header h2 { font-size: 20px; color: #991b1b; }
    .btn-close { width: 32px; height: 32px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; font-size: 18px; font-weight: 700; cursor: pointer; color: #475569; }
    .modal-body p { font-size: 14px; color: #334155; margin-bottom: 16px; line-height: 1.5; }
    .modal-body label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .modal-body input { width: 100%; height: 40px; padding: 8px 12px; border: 1px solid #94a3b8; border-radius: 6px; font-size: 14px; margin-bottom: 22px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
    .btn-cancel { height: 40px; padding: 0 18px; background: #f1f5f9; color: #0f172a; border: 1px solid #94a3b8; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-danger { height: 40px; padding: 0 18px; background: #dc2626; color: #ffffff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-page">
    <h1>Workspace Settings</h1>
    <div class="bg-form">
      <label for="bg-name-input">Workspace Name</label>
      <input id="bg-name-input" type="text" aria-label="Workspace Name" value="Acme QA" />
      <button id="bg-save-btn" type="button" class="bg-save-btn">Save Changes</button>
    </div>
  </div>

  <div class="modal-backdrop">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Delete Workspace</h2>
        <button id="modal-close" type="button" aria-label="Close dialog" class="btn-close">×</button>
      </div>
      <div class="modal-body">
        <p>This action cannot be undone. Please provide a reason before permanently deleting this workspace.</p>
        <label for="delete-reason">Deletion reason</label>
        <input id="delete-reason" type="text" aria-label="Deletion reason" placeholder="Type reason for deletion" />
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" type="button" class="btn-cancel">Cancel</button>
        <button id="modal-confirm" type="button" class="btn-danger">Confirm Delete</button>
      </div>
    </div>
  </div>
</body>
</html>
