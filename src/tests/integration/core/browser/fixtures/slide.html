<!doctype html>
<title>Slide</title>
<style>
  body { margin: 0; }
  #open { position: absolute; left: 600px; top: 10px; }
  /* Slides in from off the left edge over 5 s, like a side menu, but slow enough to catch mid-way. */
  #panel { position: fixed; left: 0; top: 0; width: 300px; height: 100%; background: #ddd; transform: translateX(-100%); transition: transform 5s linear; }
  #panel.open { transform: translateX(0); }
  #panel button { position: absolute; left: 10px; top: 100px; }
</style>
<button id="open">Open panel</button>
<nav id="panel"><button>Panel item</button></nav>
<script>
  document.getElementById("open").addEventListener("click", () => document.getElementById("panel").classList.add("open"));
</script>
