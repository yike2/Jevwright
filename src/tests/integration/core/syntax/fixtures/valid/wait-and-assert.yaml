name: "Wait and assert"
steps:
  - waitFor:
      condition: "The loading spinner has disappeared"
  - waitFor:
      selector: ".results"
  - assert:
      url: "/results"
  - assert:
      selector: ".results"
  - assert:
      selector: ".welcome-banner"
      text: "Welcome"
      statement: "A welcome banner is shown at the top of the page"
