# Expect: failed after about 10 s; step 2 (sleep) fails with the Run error "timeout", step 3 stays pending
name: "Run timeout"
description: "The whole Run is cut off by runTimeoutMs"
baseUrl: "{{BASE}}"
runTimeoutMs: 10000
steps:
  - open:
      url: "/"
  - sleep:
      ms: 30000
  - assert:
      selector: '[data-test="login-button"]'
