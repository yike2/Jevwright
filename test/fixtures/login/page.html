<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Acme — Sign in</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header>
    <span class="brand">Acme Cloud</span>
    <a href="#pricing" data-jev-id="e0">Pricing</a>
    <a href="#docs" data-jev-id="e1">Docs</a>
    <a href="#signup" data-jev-id="e2">Create account</a>
  </header>
  <main>
    <form class="card" id="login-form" onsubmit="return false">
      <h1>Sign in</h1>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" data-jev-id="e3" style="">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" data-jev-id="e4" style="">
      <div class="row">
        <input id="remember" name="remember" type="checkbox" data-jev-id="e5" style="">
        <label for="remember" style="margin:0;font-weight:400">Keep me signed in</label>
      </div>
      <div class="row">
        <button type="submit" class="primary" data-jev-id="e6">Sign in</button>
        <a href="#forgot" data-jev-id="e7">Forgot your password?</a>
      </div>
      <p class="muted">Or continue with</p>
      <div class="row">
        <button type="button" name="sso-google" data-jev-id="e8">Google</button>
        <button type="button" name="sso-github" data-jev-id="e9">GitHub</button>
      </div>
    </form>
  </main>


</body></html>
