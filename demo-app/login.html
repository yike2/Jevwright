<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme — Sign in</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header>
    <span class="brand">Acme Cloud</span>
    <a href="#pricing">Pricing</a>
    <a href="#docs">Docs</a>
    <a href="#signup">Create account</a>
  </header>
  <main>
    <form class="card" id="login-form" onsubmit="return false">
      <h1>Sign in</h1>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <div class="row">
        <input id="remember" name="remember" type="checkbox">
        <label for="remember" style="margin:0;font-weight:400">Keep me signed in</label>
      </div>
      <div class="row">
        <button type="submit" class="primary">Sign in</button>
        <a href="#forgot">Forgot your password?</a>
      </div>
      <p class="muted">Or continue with</p>
      <div class="row">
        <button type="button" name="sso-google">Google</button>
        <button type="button" name="sso-github">GitHub</button>
      </div>
    </form>
  </main>
</body>
</html>
