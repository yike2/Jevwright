# Local PostgreSQL for the backend and its integration tests (docs/tech/backend.md 5):
#   docker compose -f compose.dev.yaml up -d postgres
#   DATABASE_URL=postgresql://jevwright:jevwright@localhost:5432/jevwright
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: jevwright
      POSTGRES_PASSWORD: jevwright
      POSTGRES_DB: jevwright
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jevwright"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
