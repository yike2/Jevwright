name: CI

# Stages (docs/deploy/ci-cd.md):
#   1. checks:  typecheck, lint, unit tests, integration tests, security scan
#   2. build:   frontend build (after typecheck, lint, unit tests)
#   3. e2e:     Playwright against the built frontend, the backend and Postgres (after build)
#   4. deploy:  production over SSH on pushes to main, or the preview environment on PRs (after every test job)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never a run on main, which may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

  locator-integration-tests:
    name: Locator integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run locator integration tests
        # Runs without continue-on-error so locator regressions fail CI.
        # These tests use fakes only, so no browser install is needed.
        run: pnpm vitest run src/tests/integration/core/locator/

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run integration tests
        # #57: three browser tests in checks.test.ts and dialogs.test.ts can time out in a full local run; they pass
        # alone and in CI, so this job blocks merges.
        run: pnpm test:integration

  backend-integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: jevwright
          POSTGRES_PASSWORD: jevwright
          POSTGRES_DB: jevwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jevwright"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://jevwright:jevwright@localhost:5432/jevwright
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run backend integration tests
        # The Integration tests job runs these too, but without DATABASE_URL they are skipped there.
        run: pnpm vitest run src/tests/integration/app/backend

  security:
    name: Security scan
    runs-on: ubuntu-latest
    # Reported, not blocking yet (#101): a new advisory in a transitive dependency must not stop every merge.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @jevwright/frontend build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [frontend-build]
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: jevwright
          POSTGRES_PASSWORD: jevwright
          POSTGRES_DB: jevwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jevwright"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    # The backend's variables (src/app/backend/src/env.ts). Throwaway values: this database lives only for the job,
    # and the E2E tests never call Jev.
    env:
      DATABASE_URL: postgresql://jevwright:jevwright@localhost:5432/jevwright
      JWT_SECRET: ci-only-jwt-secret-for-e2e-tests-0000
      OPENROUTER_API_KEY: ci-not-used
      CORS_ORIGIN: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        # playwright.config.ts serves this build with next start when CI is set.
        run: pnpm --filter @jevwright/frontend build

      - name: Apply database migrations
        # The production image runs this at start (src/app/backend/Dockerfile); the CI database starts empty.
        run: pnpm --filter @jevwright/backend exec prisma migrate deploy

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - lint
      - unit-tests
      - locator-integration-tests
      - integration-tests
      - backend-integration-tests
      - e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    # Secrets and variables live in the "production" environment (docs/deploy/ci-cd.md).
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy this commit
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SHA='$SHA' bash -s" <<'SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [ -n "$(git status --porcelain)" ]; then
            echo "The server checkout has local changes; refusing to deploy:" >&2
            git status --short >&2
            exit 1
          fi
          git fetch origin main
          git checkout main
          git merge --ff-only "$SHA"
          # One deployment at a time on the server, production or preview: two builds at once run it out of memory.
          exec 9> /tmp/jevwright-deploy.lock
          flock 9
          # One image at a time: parallel builds run the VPS out of memory.
          # COMPOSE_PARALLEL_LIMIT does not apply, since compose builds through bake.
          for service in browser backend frontend; do
            docker compose build "$service"
          done
          docker compose up -d
          docker compose ps
          SCRIPT

      - name: Check health
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$API_URL/health"

  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - lint
      - unit-tests
      - locator-integration-tests
      - integration-tests
      - backend-integration-tests
      - e2e
    # Forks get no secrets, so only branches of this repository are previewed.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    # One preview slot on the VPS; its secrets and variables live in the "preview" environment (docs/deploy/ci-cd.md 4).
    environment:
      name: preview
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy this PR's commit
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' BRANCH='$BRANCH' SHA='$SHA' bash -s" <<'SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [ -n "$(git status --porcelain)" ]; then
            echo "The preview checkout has local changes; refusing to deploy:" >&2
            git status --short >&2
            exit 1
          fi
          git fetch origin "$BRANCH"
          git checkout --detach "$SHA"
          compose() { docker compose -p jevwright-preview -f compose.preview.yaml "$@"; }
          # Shares the production deploy's lock and builds one image at a time, for the same memory reason.
          exec 9> /tmp/jevwright-deploy.lock
          flock 9
          for service in preview-browser preview-backend preview-frontend; do
            compose build "$service"
          done
          compose up -d --remove-orphans
          compose ps
          docker image prune -f > /dev/null
          # Checked inside the container, so it does not depend on Caddy's routes.
          for attempt in $(seq 1 24); do
            if compose exec -T preview-backend node -e \
              "fetch('http://127.0.0.1:4000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; then
              echo "Preview backend is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "The preview backend did not become healthy:" >&2
          compose logs --tail 50 preview-backend >&2
          exit 1
          SCRIPT